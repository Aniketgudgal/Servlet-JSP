<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
	crossorigin="anonymous"
>
</head>
<body>
	<div class = "container p-3">
		<div class = "container p-2 w-25 mx-auto">
			<form action="login" method = "POST">
			<div class = "row">
				<label for = "email" class = "mt-1">Enter Email</label>
				<input type = "text"  name = "email" class = " mt-2 form-control"/>
			</div>
			<div class = "row">
			<label for = "password" class = "mt-1">Enter Password</label>
				<input type = "password" name = "password" class = " mt-2 form-control" />
			</div>
			<div class = "row mt-3">
				<button class = "btn btn-primary mt-2" >Login</button>
			</div>
			</form>
		</div>
	</div>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"
	></script>
</body>
</html>
